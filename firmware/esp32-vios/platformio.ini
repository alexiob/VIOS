; Reproducible full VDP 1.04 base, with VIOS USB multiplex and RAM bootstrap.
[platformio]
src_dir = vendor/agon-vdp/video

[env:esp32-vios]
platform = espressif32@6.3.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.maximum_size = 1310720
lib_extra_dirs = vendor
lib_ignore = agon-vdp
lib_deps = fbiego/ESP32Time@2.0.0
extra_scripts =
  pre:scripts/embed_vios.py
  post:scripts/build_manifest.py
build_flags =
  -DVIOS_USB_MUX=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Iinclude
monitor_speed = 115200

; Diagnostic app: no VDP, UART2, PS/2, audio, CS0 writes or RAM bootstrap.
[env:esp32-vios-probe]
extends = env:esp32-vios
build_flags =
  ${env:esp32-vios.build_flags}
  -DVIOS_ZDI_EARLY_PROBE=1
