# Build the VIOS manual site (docs/manual) and deploy it to https://vios.iob.dev.
#
# Every push or pull request that touches the manual builds the site and keeps
# it as a workflow artifact. A release tag (vX.Y.Z) or a manual run ("Run
# workflow") also deploys it: the vios-docs Cloudflare Worker, configured in
# tools/manual/wrangler.jsonc, with the repository secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID. Without them the deploy job prints a notice and
# stops. See docs/manual/HOSTING.md.
# The screenshots and the word reference are generated on a developer machine
# (make manual) and committed; this job only renders Markdown to HTML.
name: Manual

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['docs/manual/**', 'tools/manual/**', '.github/workflows/manual.yml']
  pull_request:
    paths: ['docs/manual/**', 'tools/manual/**', '.github/workflows/manual.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/manual
            tools/manual
            firmware/esp32-vios/vendor/agon-vdp/video
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/manual/requirements.txt
      - run: pip install -r tools/manual/requirements.txt
      - run: python tools/manual/build_site.py --out build/site
      - uses: actions/upload-artifact@v4
        with:
          name: manual-site
          path: build/site
          include-hidden-files: true

  deploy:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vios-docs
      url: https://vios.iob.dev
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/manual
      - uses: actions/download-artifact@v4
        with:
          name: manual-site
          path: build/site
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set: the site was built but not deployed (docs/manual/HOSTING.md)"
          fi
      - name: Deploy the vios-docs Worker
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0 (pinned: it receives the API token)
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config tools/manual/wrangler.jsonc
